---
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the linters
        run: pip install ansible-core==2.21.4 ansible-lint==26.9.0 yamllint==1.38.0
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint

  sanity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - stable-2.19
          - stable-2.20
          - stable-2.21
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core }}
          testing-type: sanity
